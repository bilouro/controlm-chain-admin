[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlm-chain-admin"
dynamic = ["version"]
description = "Manage BMC Control-M job chains as a git-friendly JSON repository: XML import/export, links between jobs, environment-neutral base, validation and refactorings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor H. Bilouro" }]
keywords = [
    "control-m", "controlm", "bmc", "job-scheduler", "workload-automation",
    "xml", "json", "jobs-as-code", "gitops", "devops", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []   # the core and the CLI are standard-library only

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
]
mcp = [
    "mcp>=2.3,<3",   # ctmchain mcp: the tools an assistant (Kilo, Claude) uses
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "httpx>=0.27",   # FastAPI TestClient
    "hatchling",     # tests/unit/test_packaging.py builds the sdist
    "mcp>=2.3,<3",   # tests/unit/test_mcp_server.py
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-static-i18n",
]

[project.urls]
Homepage = "https://github.com/bilouro/controlm-chain-admin"
Documentation = "https://github.com/bilouro/controlm-chain-admin#readme"
Repository = "https://github.com/bilouro/controlm-chain-admin"
Issues = "https://github.com/bilouro/controlm-chain-admin/issues"
Changelog = "https://github.com/bilouro/controlm-chain-admin/blob/main/CHANGELOG.md"

[project.scripts]
ctmchain = "controlm_chain_admin.cli:main"

[tool.hatch.version]
path = "src/controlm_chain_admin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/controlm_chain_admin"]
# The built web UI is git-ignored; include it in the wheel when present (release workflow builds it).
artifacts = ["src/controlm_chain_admin/web/static/**"]

# The whole project (everything git does not ignore): rules, skills, docs, tests and the web/
# sources travel with the code, so it can be developed where only PyPI is reachable. The built
# web UI rides along when present, so an editable install serves it without npm.
[tool.hatch.build.targets.sdist]
artifacts = ["src/controlm_chain_admin/web/static/**"]

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md", ".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["controlm_chain_admin"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "realdata: runs against the private data repository (needs CTMCHAIN_DATA_REPO); skipped in CI",
]

[tool.coverage.run]
source = ["controlm_chain_admin"]
branch = true
omit = ["*/__main__.py"]   # covered by a subprocess test, invisible to coverage

[tool.coverage.report]
show_missing = true
fail_under = 90
