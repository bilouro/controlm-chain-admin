site_name: controlm-chain-admin
site_url: https://ctmchain.bilouro.com/
site_description: >-
  Control-M job chains as JSON in git: one branch per environment, real differences only,
  and the import file already written for the environment that receives it.
site_author: Victor Bilouro
copyright: Copyright &copy; 2026 Victor Bilouro · MIT
repo_url: https://github.com/bilouro/controlm-chain-admin
repo_name: bilouro/controlm-chain-admin
edit_uri: edit/main/docs/

hooks:
  - hooks/sitemap_alias.py

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - pt
        - en
  # Social/OG cards are generated only in CI (needs Cairo/Pillow imaging deps).
  # Locally, without CI=true, the plugin is disabled so `mkdocs build` still works.
  - social:
      enabled: !ENV [CI, false]
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          site_name: controlm-chain-admin
          site_description: >-
            Cadeias de jobs do Control-M como JSON em git: um branch por ambiente, só as
            diferenças reais, e o ficheiro de import já escrito para o ambiente que recebe.
          nav_translations:
            Home: Início
            Getting Started: Começar
            Installation & Quickstart: Instalação e Quickstart
            Concepts: Conceitos
            Guides: Guias
            Refresh an environment: Atualizar um ambiente
            The map: O mapa
            Compare two environments: Comparar dois ambientes
            Take and package: Levar e empacotar
            Deliveries kept for later: Entregas guardadas
            A branch of your own: Um branch teu
            Validate and fix: Validar e corrigir
            Resources: Recursos
            Web UI: Página web
            Assistant: Assistente
            Performance: Desempenho
            Command reference: Referência dos comandos
            API Reference: Referência API
            Security: Segurança
            Contributing: Contribuir
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
    - Installation & Quickstart: getting-started/index.md
    - Concepts: getting-started/concepts.md
  - Guides:
    - Refresh an environment: guide/refresh.md
    - The map: guide/map.md
    - Compare two environments: guide/compare.md
    - Take and package: guide/take-package.md
    - Deliveries kept for later: guide/deliveries.md
    - A branch of your own: guide/own-branch.md
    - Validate and fix: guide/validate.md
    - Resources: guide/resources.md
  - Web UI: web-ui.md
  - Assistant: assistant.md
  - Performance: performance.md
  - Command reference: cli.md
  - API Reference: api/index.md
  - Security: security.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bilouro/controlm-chain-admin
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/controlm-chain-admin/
